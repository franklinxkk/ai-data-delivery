version: mock-finance-1.0
domain: 金融·信贷风控与经营

datasets:
  - name: loans
    source: loans
    cn: 贷款事实表
    grain: 一行一笔贷款
    primary_key: loan_id
    ai:
      instructions: 能答贷款规模/逾期/产品分布统计；必带时间围栏（apply_date）；借款人证件号不出答案
    fields:
      - {name: loan_id, role: pk, cn: 贷款编号}
      - {name: apply_date, role: time, cn: 申请日期}
      - {name: product_type, role: dim, cn: 产品类型, enum: [经营贷, 消费贷, 房贷]}
      - {name: status, role: dim, cn: 贷款状态, enum: [正常, 逾期, 结清]}
      - {name: amount, role: measure, cn: 放款金额}
      - {name: overdue_days, role: measure, cn: 逾期天数}
      - {name: borrower_id, role: fk, cn: 借款人编号}

  - name: borrowers
    source: borrowers
    cn: 借款人维度表
    grain: 一行一个借款人
    primary_key: borrower_id
    ai:
      instructions: 能答借款人风险分层统计；证件号为敏感字段，任何场景不出库不出答案
    fields:
      - {name: borrower_id, role: pk, cn: 借款人编号}
      - {name: name, role: attr, cn: 姓名}
      - {name: risk_level, role: dim, cn: 风险等级, enum: [低, 中, 高]}
      - {name: id_card, role: attr, cn: 证件号, sensitive: true, allow_llm: false}
      - {name: reg_date, role: time, cn: 开户日期}

relationships:
  - {from: loans, to: borrowers, join_key: borrower_id, cardinality: "N:1", traversable: true}

concepts:
  - term: 高风险借款人
    synonyms: [高风险客户]
    expand: {dataset: borrowers, field: risk_level, values: [高]}

metrics:
  - id: loan_count
    name: 贷款总笔数
    synonyms: [放款笔数]
    type: count
    dataset: loans
    structured: true
    status: 已发布
    expr: COUNT(*)
    time_field: apply_date
    unit: 笔
    caliber: {note: 全部贷款笔数, basis: mock 内部约定}

  - id: overdue_loan_count
    name: 逾期贷款笔数
    synonyms: [逾期笔数]
    type: count
    dataset: loans
    structured: true
    status: 已发布
    expr: COUNT(*)
    filters: [{field: status, values: [逾期]}]
    time_field: apply_date
    unit: 笔
    caliber: {note: 按状态口径（status=逾期）；与 overdue_days>0 天数口径并存，评审决议按状态口径, basis: 风控评审纪要2026-09-15}

  - id: overdue_rate
    name: 逾期率
    synonyms: [贷款逾期率]
    type: ratio
    dataset: loans
    structured: true
    status: 已发布
    numerator: {expr: "SUM(CASE WHEN status = '逾期' THEN 1 ELSE 0 END)"}
    denominator: {expr: COUNT(*)}
    time_field: apply_date
    unit: "%"
    caliber: {note: 逾期笔数占总笔数（SUM/SUM 加权）, basis: 风控评审纪要2026-09-15}

  - id: loan_amount_sum
    name: 放款总额
    synonyms: [贷款总额]
    type: sum
    dataset: loans
    structured: true
    status: 已发布
    expr: SUM(amount)
    time_field: apply_date
    unit: 元
    caliber: {note: 全部放款金额合计, basis: mock 内部约定}

  - id: high_risk_borrower_count
    name: 高风险借款人数
    synonyms: [高风险客户数]
    type: count
    dataset: borrowers
    structured: true
    status: 已发布
    expr: COUNT(*)
    filters: [{field: risk_level, values: [高]}]
    time_field: reg_date
    unit: 人
    caliber: {note: 风险等级为高的借款人, basis: mock 内部约定}
