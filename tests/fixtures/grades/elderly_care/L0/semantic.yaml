version: mock-elderly-care-1.0-L0
domain: 养老·机构等级评定
datasets:
- name: dws_facility_monthly
  source: dws_facility_monthly
  cn: 机构月度运营宽表
  fields:
  - name: facility
    role: dim
    cn: 养老机构
    enum:
    - 康宁养老院
    - 颐年养老院
    - 安泰养老院
  - name: month
    role: dim
    cn: 月份
    enum:
    - 2026-06
    - 2026-07
    - 2026-08
  - name: bed_count
    role: measure
    cn: 床位数
  - name: resident_count
    role: measure
    cn: 入住老人数
  - name: caregiver_count
    role: measure
    cn: 护理员数
  - name: certified_caregiver_count
    role: measure
    cn: 持证护理员数
  - name: rehab_service_cnt
    role: measure
    cn: 康复服务人次数
  - name: complaint_cnt
    role: measure
    cn: 投诉件数
  - name: stat_date
    role: time
    cn: 统计截止日
relationships: []
metrics:
- id: occupancy_rate
  name: 机构入住率
  synonyms:
  - 入住率
  type: ratio
  dataset: dws_facility_monthly
  structured: true
  status: 已发布
  numerator:
    expr: SUM(resident_count)
  denominator:
    expr: SUM(bed_count)
  time_field: stat_date
  unit: '%'
  caliber:
    note: 入住老年人总数 ÷ 总床位数（多月份为 SUM/SUM 加权的月均口径；等级评定以评定时点值为准，mock 用月均近似）
    basis: GB/T 37276-2018《养老机构等级划分与评定》术语定义与等级门槛
- id: caregiver_ratio
  name: 护理员配比
  synonyms:
  - 护理员老人比
  type: ratio
  dataset: dws_facility_monthly
  structured: true
  status: 已发布
  numerator:
    expr: SUM(resident_count)
  denominator:
    expr: SUM(caregiver_count)
  time_field: stat_date
  unit: ∶1
  caliber:
    note: 入住老人数 ÷ 护理员数（SUM/SUM 加权月均口径；各等级对配比有差异性门槛要求）
    basis: GB/T 37276-2018《养老机构等级划分与评定》人员配比门槛
- id: certified_caregiver_rate
  name: 持证护理员占比
  synonyms:
  - 护理员持证率
  type: ratio
  dataset: dws_facility_monthly
  structured: true
  status: 已发布
  numerator:
    expr: SUM(certified_caregiver_count)
  denominator:
    expr: SUM(caregiver_count)
  time_field: stat_date
  unit: '%'
  caliber:
    note: 持证护理员数 ÷ 护理员总数（养老护理员职业技能等级证书口径）
    basis: GB/T 37276-2018《养老机构等级划分与评定》人员资质要求
- id: rehab_coverage_rate
  name: 康复服务覆盖率
  synonyms:
  - 康复覆盖率
  type: ratio
  dataset: dws_facility_monthly
  structured: true
  status: 已发布
  numerator:
    expr: SUM(rehab_service_cnt)
  denominator:
    expr: SUM(resident_count)
  time_field: stat_date
  unit: '%'
  caliber:
    note: 康复服务人次数 ÷ 入住老人数（>100% 说明有老人多次接受服务；mock 以服务人次近似覆盖口径）
    basis: GB/T 37276-2018《养老机构等级划分与评定》服务提供要求（康复服务定义见术语）
- id: monthly_complaints
  name: 月均投诉件数
  synonyms:
  - 平均每月投诉
  type: ratio
  dataset: dws_facility_monthly
  structured: true
  status: 已发布
  numerator:
    expr: SUM(complaint_cnt)
  denominator:
    expr: COUNT(*)
  time_field: stat_date
  unit: 件
  caliber:
    note: 投诉件数合计 ÷ 机构月数（服务质量追溯的反向指标）
    basis: GB/T 37276-2018《养老机构等级划分与评定》运营管理要求
