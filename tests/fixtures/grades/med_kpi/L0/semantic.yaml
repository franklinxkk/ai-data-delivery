version: mock-med-kpi-1.0-L0
domain: 医疗·三级公立医院绩效考核
datasets:
- name: dws_dept_monthly
  source: dws_dept_monthly
  cn: 科室月度运营宽表
  fields:
  - name: dept
    role: dim
    cn: 科室
    enum:
    - 心血管内科
    - 骨科
    - 普外科
  - name: month
    role: dim
    cn: 月份
    enum:
    - 2026-06
    - 2026-07
    - 2026-08
  - name: outpatient_visits
    role: measure
    cn: 门诊人次
  - name: outpatient_rev
    role: measure
    cn: 门诊收入
  - name: drug_rev
    role: measure
    cn: 药品收入
  - name: med_service_rev
    role: measure
    cn: 医疗服务收入
  - name: discharges
    role: measure
    cn: 出院人数
  - name: surgeries
    role: measure
    cn: 手术台次
  - name: level4_surgeries
    role: measure
    cn: 四级手术台次
  - name: open_bed_days
    role: measure
    cn: 开放床日数
  - name: occupied_bed_days
    role: measure
    cn: 占用床日数
  - name: stat_date
    role: time
    cn: 统计截止日
relationships: []
metrics:
- id: bed_occupancy_rate
  name: 床位使用率
  synonyms:
  - 病床使用率
  type: ratio
  dataset: dws_dept_monthly
  structured: true
  status: 已发布
  numerator:
    expr: SUM(occupied_bed_days)
  denominator:
    expr: SUM(open_bed_days)
  time_field: stat_date
  unit: '%'
  caliber:
    note: 实际占用总床日数 ÷ 实际开放总床日数（SUM/SUM 加权）
    basis: 国办发〔2019〕4号三级公立医院绩效考核指标体系；国家卫生健康统计调查制度
- id: drug_ratio
  name: 门诊药占比
  synonyms:
  - 药占比
  type: ratio
  dataset: dws_dept_monthly
  structured: true
  status: 已发布
  numerator:
    expr: SUM(drug_rev)
  denominator:
    expr: SUM(outpatient_rev)
  time_field: stat_date
  unit: '%'
  caliber:
    note: 门诊药品收入 ÷ 门诊收入（不含耗材的延伸口径需另行声明）
    basis: 国办发〔2019〕4号三级公立医院绩效考核指标体系（运营效率类，监测比较指标）
- id: level4_surgery_ratio
  name: 四级手术占比
  synonyms:
  - 四级手术比例
  type: ratio
  dataset: dws_dept_monthly
  structured: true
  status: 已发布
  numerator:
    expr: SUM(level4_surgeries)
  denominator:
    expr: SUM(surgeries)
  time_field: stat_date
  unit: '%'
  caliber:
    note: 四级手术台次 ÷ 手术总台次（出院患者手术口径；mock 以科室汇总台次替代）
    basis: 国办发〔2019〕4号三级公立医院绩效考核指标体系（医疗质量类定量指标）
- id: med_service_rev_ratio
  name: 医疗服务收入占比
  synonyms:
  - 医疗服务收入比例
  type: ratio
  dataset: dws_dept_monthly
  structured: true
  status: 已发布
  numerator:
    expr: SUM(med_service_rev)
  denominator:
    expr: SUM(outpatient_rev)
  time_field: stat_date
  unit: '%'
  caliber:
    note: 医疗服务收入 ÷ 医疗收入（不含药品、耗材、检查检验收入；mock 以门诊收入替代医疗收入口径）
    basis: 国办发〔2019〕4号三级公立医院绩效考核指标体系（运营效率类定量指标）
- id: outpatient_avg_fee
  name: 门诊次均费用
  synonyms:
  - 门诊均次费用
  type: ratio
  dataset: dws_dept_monthly
  structured: true
  status: 已发布
  numerator:
    expr: SUM(outpatient_rev)
  denominator:
    expr: SUM(outpatient_visits)
  time_field: stat_date
  unit: 元
  caliber:
    note: 门诊收入 ÷ 门诊人次数（SUM/SUM 加权，禁行级平均）
    basis: 国办发〔2019〕4号三级公立医院绩效考核指标体系（次均费用增幅的基期口径）
